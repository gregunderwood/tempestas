[project]
name = "tempestas-agent-micropython"
version = "0.1.0"
description = "The tempestas node agent for a Raspberry Pi Pico W, in MicroPython"
requires-python = ">=3.11"
license = "BUSL-1.1"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
src = ["device", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
  "agent_version",
  "board",
  "bootloader",
  "command_guard",
  "contract",
  "credentials",
  "ds18b20_probes",
  "http_fetch",
  "iso_time",
  "node_runtime",
  "tempestas_mqtt",
  "node_agent",
  "node_updates",
  "relay_lines",
  "settings",
  "slot_installer",
  "slots",
  "update_gate",
  "update_guard",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["device", "tests"]
