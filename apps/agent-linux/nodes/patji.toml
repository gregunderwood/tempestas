# patji: the Pi Zero W heating the pumphouse. Wiring and every number here: docs/Pumphouse.md.
# Deploy to /home/<user>/tempestas/etc/agent.toml; credentials live in /etc/tempestas/agent.env.

node_id = "patji"
kind = "rpi"

# "Hold, then on": both loads hang off NC contacts, so a dead elantris leaves them running.
deadman_s = 600.0

[mqtt]
url = "mqtt://192.168.2.70:1883"

[sensor]
kind = "ds18b20"
sample_interval_s = 10.0

# Pinned by ROM id, never by bus order; label each cable end with its sensor_id.
[[sensor.probes]]
rom = "28-3ce1d443663c"
sensor_id = "pipes"

[[sensor.probes]]
rom = "28-3ce1d4436bd1"
sensor_id = "air"

# The third probe, not soldered yet. Uncomment with its real ROM.
# [[sensor.probes]]
# rom = "28-zzzzzzzzzzzz"
# sensor_id = "floor"

[gpio]
# BCM5 -> IN1 -> heater (through the JQX-62F 110VAC contactor); BCM6 -> IN2 -> heat tape.
lines = [5, 6]
chip_label = "pinctrl-bcm2835"   # Pi Zero W v1.1, BCM2835

[gpio.failsafe]
# 1 de-energises the active-LOW relay, closing NC: load ON. config.txt drives both high from boot.
5 = 1
6 = 1
