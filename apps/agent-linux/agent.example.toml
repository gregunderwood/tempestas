# Copy to /etc/tempestas/agent.toml on the node.

node_id = "elantris"
kind = "rpi"
agent_version = "0.1.0"

# No heartbeat for this long and the node fails safe on its own, with no server
# involvement. The burner's hold wants to be LONGER at night, because it is also
# the heater - that value is still an open question, see docs/Roadmap.md.
deadman_s = 30.0

[mqtt]
url = "mqtt://127.0.0.1:1883"
# username / password once the broker stops being anonymous (phase 12).

[sensor]
kind = "scd4x"          # scd4x | simulated | world | ds18b20
sensor_id = "scd4x-0"
bus = 1
address = 0x62
sample_interval_s = 10.0
# Applied at EVERY startup, never trusted to persist. Tune it at the installed
# self-heating equilibrium, not in open air.
# temperature_offset_c = 6.0
# altitude_m = 600

# Outside these a word is treated as the sensor having no answer, not as a
# measurement. A dying SCD41 on elantris emitted 293 ppm and 15,723 ppm on
# 2026-09-12 and the old guard - the chip's whole 0..40000 output width - stored
# both as real. Low is the dangerous direction: the rules engine resolves
# `node:<slug>` to a SINGLE sample, so one spurious low reading is a command to
# light a burner.
#
# 400 is about outdoor air, and this greenhouse leaks toward it at ~3% of the
# gradient per minute, so it cannot sit below that for long. A SEALED house with
# a heavy crop genuinely can deplete lower, and should lower the floor rather
# than widen it back out.
# co2_min_ppm = 400
# co2_max_ppm = 5000   # the SCD4x's specified ceiling; it can EMIT up to 40000

# Automatic Self-Calibration. Sensirion ship it ENABLED, and nothing here
# touched it before 2026-09-12, so every reading this system has taken was on a
# sensor quietly recalibrating itself.
#
# ASC treats the lowest reading of the past week as 400 ppm outdoor air. An
# ENRICHED greenhouse never returns there, so it revises the baseline toward a
# number the air never reaches and the sensor reads progressively low - the
# direction that calls for more CO2. Off by default for that reason.
#
# A sensor-only node in UNENRICHED air is the opposite case: leave it on and it
# needs no manual recalibration at all.
# automatic_self_calibration = false

# Refuse readings that CHANGE faster than the greenhouse physically can. The
# range guard above sees impossible VALUES; this sees impossible CHANGES, which
# is how a degrading sensor produces plausible numbers at impossible speeds - on
# 2026-09-13 elantris emitted jumps of 154, 184 and 489 ppm between consecutive
# 10-second samples, every one inside 400-5000 and invisible to the range check.
#
# Calibrated against a known-good day, not from theory. Per-sample rates on a
# HEALTHY sensor reach 285 ppm/min at p99 and peak near 390, because a
# 10-second window amplifies quantisation noise - so 200 refused 2.8% of a clean
# day, MORE than it refused of a degraded one. 400 refuses nothing clean and
# 1.1% degraded. Zero disables it.
# co2_max_change_ppm_per_min = 400

# --- ds18b20 instead (the pumphouse) -----------------------------------------
# Each probe is its own sensor, published on its own topic and named by the ROM
# id it carries, never by bus order: a probe swapped after a failure must not
# silently take over another's name. Read ROM ids one probe at a time with
# `ls /sys/bus/w1/devices/`, and label each cable end with its sensor_id. A
# probe on the bus that is not listed here is logged and ignored. Needs
# `dtoverlay=w1-gpio` (BCM4) in config.txt.
#
# kind = "ds18b20"
# [[sensor.probes]]
# rom = "28-xxxxxxxxxxxx"
# sensor_id = "pipes"
# [[sensor.probes]]
# rom = "28-yyyyyyyyyyyy"
# sensor_id = "air"
#
# A pipe in a sleeve cannot move this fast; a glitch can. 0 disables it.
# temperature_max_change_c_per_min = 10.0

[gpio]
# EMPTY MEANS NO GPIO AT ALL: no capability is advertised, no chip is opened,
# and the server cannot create a device on this node. That is the right posture
# for a sensor-only box, and it is what `gpio.build()` enforces - it returns
# NoGpio whatever else is set here.
#
# elantris, as wired: BCM 5 -> In6 (CO2 generator), 6 -> In7, 4 -> In8. The
# mapping is a permutation; no arithmetic relates a BCM number to a channel.
lines = []
# lines = [5, 6, 4]
chip_label = "pinctrl-bcm2711"   # pinctrl-rp1 on a Pi 5. By label, never number.

# Every managed line needs a declared safe level; the agent refuses to start
# otherwise. Active-LOW relays are de-energised by 1.
#
# This is also the level each line is CLAIMED at, and the bias is pulled toward
# it - so the pad is never an output at a level nobody chose, and a released or
# killed process leaves it here. See docs/Infrastructure/Linux Agent.md.
[gpio.failsafe]
# 5 = 1
# 6 = 1
# 4 = 1
