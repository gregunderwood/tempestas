# Copy to /etc/tempestas/agent.toml on the node. Reasoning: docs/Infrastructure/Linux Agent.md.

node_id = "elantris"
kind = "rpi"
agent_version = "0.1.0"

# No heartbeat for this long and the node fails safe on its own; the night value is still open.
deadman_s = 30.0

[mqtt]
url = "mqtt://127.0.0.1:1883"
# Credentials come from MQTT_USERNAME / MQTT_PASSWORD in /etc/tempestas/agent.env, never here.

[sensor]
kind = "scd4x"          # scd4x | simulated | world | ds18b20
sensor_id = "scd4x-0"
bus = 1
address = 0x62
sample_interval_s = 10.0
# Applied at every startup; tune it at the installed self-heating equilibrium, not in open air.
# temperature_offset_c = 6.0
# altitude_m = 600

# Outside these a word is the sensor having no answer, not a measurement. See "The CO2 range guard".
# co2_min_ppm = 300
# co2_max_ppm = 5000

# Off because ASC reads an enriched greenhouse progressively low; on suits unenriched air.
# automatic_self_calibration = false

# Refuse readings that change faster than the greenhouse can. 0 disables it. See "The rate guard".
# co2_max_change_ppm_per_min = 400

# ds18b20 instead: one sensor per probe, pinned by ROM id. Needs `dtoverlay=w1-gpio` (BCM4).
#
# kind = "ds18b20"
# [[sensor.probes]]
# rom = "28-xxxxxxxxxxxx"
# sensor_id = "pipes"
# [[sensor.probes]]
# rom = "28-yyyyyyyyyyyy"
# sensor_id = "air"
#
# temperature_max_change_c_per_min = 10.0

[gpio]
# Empty means no GPIO at all: no chip is opened and the server cannot create a device here.
lines = []
# lines = [5, 6, 4]   # elantris: BCM 5 -> In6 (CO2 generator), 6 -> In7, 4 -> In8
chip_label = "pinctrl-bcm2711"   # pinctrl-rp1 on a Pi 5. By label, never number.

# Every managed line needs a safe level, also the level it is claimed at. Active-LOW off is 1.
[gpio.failsafe]
# 5 = 1
# 6 = 1
# 4 = 1
