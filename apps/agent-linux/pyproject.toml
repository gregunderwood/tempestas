[project]
name = "tempestas-agent"
version = "0.1.0"
description = "The tempestas node agent: owns one box's sensors and relays, speaks MQTT."
requires-python = ">=3.11"
dependencies = [
  # Raw I2C, deliberately not adafruit-circuitpython-scd4x + Blinka; see docs/Hardware.md.
  "smbus2>=0.5.0",
  "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
# Only on a Pi. Never RPi.GPIO, rpi-lgpio or gpiozero: they fight our handle for the same lines.
gpio = ["lgpio>=0.2.2.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
tempestas-agent = "tempestas_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tempestas_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
