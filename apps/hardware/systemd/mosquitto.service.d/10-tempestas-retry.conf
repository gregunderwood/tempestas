# Install to /etc/systemd/system/mosquitto.service.d/10-tempestas-retry.conf
#
# `bind_interface wlan0` in tempestas.conf makes mosquitto EXIT when wlan0 has
# no address yet - and at boot on WiFi it often has none, network-online.target
# notwithstanding. The packaged unit restarts on failure, but with no
# RestartSec it burned the default five starts inside one second and stayed
# failed. That happened on elantris at the 2026-11-06 boot and went unnoticed
# for eleven days, with every sensor stale.
#
# So: no start limit, and a pause between attempts long enough for DHCP to
# finish. Retrying a broker forever is harmless - unlike the agent, it drives
# no relay - and a broker that gives up is a system that has silently stopped.

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5
