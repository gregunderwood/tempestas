# patji - east wall, middle of the greenhouse, under canopy.
#
# SENSOR ONLY. `lines = []` is not an empty default, it is the whole point:
# with no lines the agent opens no chip, advertises no GPIO capability, and the
# server cannot create a device on this node. It has nothing to drive and no
# way to acquire anything to drive.
#
# Deploy to /home/<user>/tempestas/etc/agent.toml on the box.
# Credentials live in /etc/tempestas/agent.env (0600 root), never here.

node_id = "patji"
kind = "rpi"
agent_version = "0.1.0"

# Meaningless on a node that cannot actuate - there is nothing to fail safe -
# but left at the default so the heartbeat still tells us when it goes quiet.
deadman_s = 30.0

[mqtt]
url = "mqtt://192.168.2.70:1883"

[sensor]
kind = "scd4x"
sensor_id = "scd4x-0"
bus = 1
address = 0x62
sample_interval_s = 10.0

# UNSET until calibrated at installed equilibrium. The M5Stack CO2L is a sealed
# plastic enclosure, so it will self-heat more than elantris's bare Adafruit
# breakout and will NOT share its 3.2 C figure. Guessing one is worse than the
# known unknown: see docs/Hardware.md on tuning it.
# temperature_offset_c =
altitude_m = 600

# OFF. patji sits mid-greenhouse under canopy, which is enriched air - it does
# not see outdoor CO2 regularly, so ASC would revise its baseline toward a
# number this spot never reaches and it would read progressively low.
#
# Turn this ON only if it ends up somewhere genuinely ventilated, where it
# would then self-calibrate forever with no manual intervention.
automatic_self_calibration = false

[gpio]
lines = []
# Never read, because no lines are claimed. Present so that wiring this box up
# later is a change to `lines`, not a hunt for what the label should be.
chip_label = "pinctrl-bcm2835"   # Pi Zero W v1.1, BCM2835

[gpio.failsafe]
# Deliberately empty. A safe level is a statement about a load, and this node
# has none.
