# Install to /etc/mosquitto/conf.d/tempestas.conf
#
# An MQTT publish on this broker goes straight to a GPIO pin and a propane
# burner, bypassing every HTTP control in the system. That is why this file
# exists and why docs/Safety.md ranks securing Mosquitto above everything else
# in the auth section: it is the real attack surface, not the API.

# ---------------------------------------------------------------- the trap
#
# Mosquitto 2.x ships with NO listener directive, which gives you a local-only
# listener that ALSO allows anonymous connections. Adding a listener to reach
# the LAN silently inherits that unless anonymous access is turned off in the
# same change. So this line comes first, before any listener below it.
allow_anonymous false

password_file /etc/mosquitto/tempestas.passwd
# Per-node scoping. Without it, any client holding any valid credential can
# publish tempestas/v1/node/elantris/gpio/set. Authentication says who you are;
# only the ACL says whose relays you may command.
acl_file /etc/mosquitto/tempestas.acl

# ---------------------------------------------------------------- listeners
#
# Two, both on 1883. Defining any listener drops the implicit local-only one,
# so loopback has to be named explicitly or the agent on this box loses its
# broker.
listener 1883 127.0.0.1

# The LAN. Bound by INTERFACE rather than by address: this box is on DHCP, and
# a hardcoded 192.168.2.70 turns a lease change into a broker that will not
# start. There is no WAN interface here and there must never be a port-forward
# to this port - remote access is a VPN question, not an authentication one.
listener 1883
bind_interface wlan0

# ---------------------------------------------------------------- sessions
#
# A persistent session is a queue of commands waiting to replay on reconnect,
# and for a relay that may be holding a burner that is a hazard rather than a
# convenience. The agent and the server both connect with clean sessions; this
# caps how long the broker would hold one if something else did not.
persistent_client_expiration 1h

# Commands are QoS 1 and never retained, so a deep queue buys nothing and a
# shallow one fails loudly instead of replaying stale burner commands after an
# outage. See docs/Infrastructure/MQTT Contract.md.
max_queued_messages 100
