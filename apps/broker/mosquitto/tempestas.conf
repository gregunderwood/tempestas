# Install to /etc/mosquitto/conf.d/tempestas.conf. Why each line matters: docs/Safety.md.

# Must land before any listener: Mosquitto 2.x otherwise lets a new listener inherit anonymous access.
allow_anonymous false

password_file /etc/mosquitto/tempestas.passwd
acl_file /etc/mosquitto/tempestas.acl

# Naming any listener drops the implicit loopback one, which the agent on this box needs.
listener 1883 127.0.0.1

# Bound by interface because this box is on DHCP; never port-forward it.
listener 1883
bind_interface wlan0

# A persistent session is a queue of burner commands waiting to replay on reconnect.
persistent_client_expiration 1h

# Commands are never retained, so a shallow queue fails loudly instead of replaying stale ones.
max_queued_messages 100
