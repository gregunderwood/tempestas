[project]
name = "tempestas-sim"
version = "0.1.0"
description = "One greenhouse, shared by every agent in the sandbox."
requires-python = ">=3.11"
# Deliberately dependency-free. The world is pure arithmetic and the server is
# http.server from the standard library: the sandbox must run anywhere the
# agent runs, including a 32-bit Pi, without a wheel to build.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
tempestas-sim = "tempestas_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tempestas_sim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
