[project]
name = "tempestas-sim"
version = "0.1.0"
description = "One greenhouse, shared by every agent in the sandbox."
requires-python = ">=3.11"
# Dependency-free so the sandbox runs anywhere the agent does, without a wheel to build.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
tempestas-sim = "tempestas_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tempestas_sim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
