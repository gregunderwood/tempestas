<title>PR Video Player</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
/>
<style>
  /* One column: the video, then its controls, then the steps it walks through. */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --fg: #17202b;
    --muted: #5a6676;
    --line: #d9dfe7;
    --accent: #0b4a8f;
    --accent-soft: #e3ecf7;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:
      'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #10151c;
      --surface: #18202a;
      --fg: #e6ebf1;
      --muted: #98a4b3;
      --line: #2a3542;
      --accent: #7fb1ec;
      --accent-soft: #1d2f45;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #10151c;
    --surface: #18202a;
    --fg: #e6ebf1;
    --muted: #98a4b3;
    --line: #2a3542;
    --accent: #7fb1ec;
    --accent-soft: #1d2f45;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    gap: 16px;
  }
  header {
    display: grid;
    gap: 4px;
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    margin: 0;
    text-wrap: balance;
  }
  .meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0;
  }
  .meta code,
  li code {
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }
  video {
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    background: #000;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
  }
  .group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-right: 2px;
  }
  button {
    font: 500 0.85rem var(--font-body);
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 6px 10px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  button:hover {
    border-color: var(--accent);
  }
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button[aria-pressed='true'] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .clock {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
  }
  h3 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  ol {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 2px;
  }
  ol button {
    width: 100%;
    text-align: left;
    display: grid;
    grid-template-columns: 3.2rem 1fr;
    gap: 10px;
    border-color: transparent;
    background: transparent;
    padding: 7px 8px;
  }
  ol button[aria-current='true'] {
    background: var(--accent-soft);
  }
  .videos {
    display: grid;
    gap: 28px;
  }
  article {
    display: grid;
    gap: 12px;
  }
  h2.spec {
    font-size: 1.05rem;
    font-family: var(--font-mono);
    font-weight: 500;
    margin: 0;
  }
  .error {
    color: var(--muted);
  }
  .at {
    font-family: var(--font-mono);
    color: var(--accent);
  }
  .note {
    color: var(--muted);
    font-size: 0.82rem;
    margin: 10px 0 0;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<main>
  <header>
    <h1 id="heading">PR video</h1>
    <p class="meta" id="meta">Loading the recording…</p>
  </header>
  <div class="videos" id="videos"></div>
  <p class="note">
    The left of each video is Cypress's own log of every command and check. Step
    times come from the run itself.
  </p>
</main>

<template id="video-template">
  <article>
    <h2 class="spec"></h2>
    <video controls playsinline preload="auto"></video>
    <div class="controls">
      <div class="group" role="group" aria-label="Playback speed">
        <span class="label">Speed</span>
        <button type="button" data-speed="0.25">0.25×</button>
        <button type="button" data-speed="0.5">0.5×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="1.5">1.5×</button>
        <button type="button" data-speed="2">2×</button>
      </div>
      <div class="group" role="group" aria-label="Step through frames">
        <span class="label">Frame</span>
        <button type="button" data-frame="-1" aria-label="One frame back">
          ◀
        </button>
        <button type="button" data-play>Play</button>
        <button type="button" data-frame="1" aria-label="One frame forward">
          ▶
        </button>
      </div>
      <span class="clock">0.00 s</span>
    </div>
    <section>
      <h3 class="steps-heading">Jump to a step</h3>
      <ol class="steps"></ol>
    </section>
  </article>
</template>

<script>
  // tools/pr-video.sh writes videos.json beside this page: { pullRequest, commit, videos: [{ spec, file, steps: [{ title, seconds }] }] }.
  const FRAME_SECONDS = 1 / 25;

  function formatTime(seconds) {
    const wholeSeconds = Math.floor(seconds);
    return `${Math.floor(wholeSeconds / 60)}:${String(wholeSeconds % 60).padStart(2, '0')}`;
  }

  function buildStepButton(step, video) {
    const item = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.at = String(step.seconds);
    const time = document.createElement('span');
    time.className = 'at';
    time.textContent = formatTime(step.seconds);
    const title = document.createElement('span');
    title.textContent = step.title;
    button.append(time, title);
    button.addEventListener('click', () => {
      video.currentTime = step.seconds;
      video.play().catch(() => undefined);
    });
    item.append(button);
    return item;
  }

  function wireControls(article, video) {
    const speedButtons = [...article.querySelectorAll('[data-speed]')];
    const stepButtons = () => [...article.querySelectorAll('[data-at]')];
    const playButton = article.querySelector('[data-play]');
    const clock = article.querySelector('.clock');
    const markSpeed = () =>
      speedButtons.forEach((button) =>
        button.setAttribute(
          'aria-pressed',
          String(Number(button.dataset.speed) === video.playbackRate),
        ),
      );
    const showPosition = () => {
      clock.textContent = `${video.currentTime.toFixed(2)} s`;
      const current = stepButtons()
        .filter(
          (button) => Number(button.dataset.at) <= video.currentTime + 0.01,
        )
        .pop();
      stepButtons().forEach((button) =>
        button.setAttribute('aria-current', String(button === current)),
      );
    };
    speedButtons.forEach((button) =>
      button.addEventListener(
        'click',
        () => (video.playbackRate = Number(button.dataset.speed)),
      ),
    );
    article.querySelectorAll('[data-frame]').forEach((button) =>
      button.addEventListener('click', () => {
        video.pause();
        const target =
          video.currentTime + Number(button.dataset.frame) * FRAME_SECONDS;
        video.currentTime = Math.min(Math.max(target, 0), video.duration || 0);
      }),
    );
    playButton.addEventListener('click', () =>
      video.paused ? video.play().catch(() => undefined) : video.pause(),
    );
    video.addEventListener('play', () => (playButton.textContent = 'Pause'));
    video.addEventListener('pause', () => (playButton.textContent = 'Play'));
    video.addEventListener('ratechange', markSpeed);
    video.addEventListener('timeupdate', showPosition);
    video.addEventListener('seeked', showPosition);
    showPosition();
  }

  function renderVideo(recording, index) {
    const article = document
      .getElementById('video-template')
      .content.firstElementChild.cloneNode(true);
    const headingId = `steps-${index}`;
    article.querySelector('.spec').textContent = recording.spec;
    article.querySelector('.steps-heading').id = headingId;
    article.querySelector('section').setAttribute('aria-labelledby', headingId);
    const video = article.querySelector('video');
    video.src = recording.file;
    const steps = article.querySelector('.steps');
    recording.steps.forEach((step) =>
      steps.append(buildStepButton(step, video)),
    );
    wireControls(article, video);
    return article;
  }

  async function showRecordings() {
    const meta = document.getElementById('meta');
    try {
      const response = await fetch('videos.json');
      const recordings = await response.json();
      document.getElementById('heading').textContent =
        `PR #${recordings.pullRequest}, as it runs`;
      document.title = `PR #${recordings.pullRequest} Video`;
      meta.textContent = `Recorded at ${recordings.commit} by tools/pr-video.sh, on a real server with the fake driver.`;
      document
        .getElementById('videos')
        .append(...recordings.videos.map(renderVideo));
    } catch {
      meta.textContent =
        'videos.json did not load, so there is nothing to play. Publish it beside this page.';
      meta.className = 'meta error';
    }
  }

  showRecordings();
</script>
