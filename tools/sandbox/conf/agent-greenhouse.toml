# Sandbox greenhouse. Mirrors the far-end Pi 5 as verified 2026-09-10.
node_id = "greenhouse"
kind = "rpi"
agent_version = "0.1.0"
deadman_s = 30.0

[mqtt]
# elantris's broker, as planned for production; a bridged local broker comes later.
url = "mqtt://127.0.0.1:1883"

[world]
url = "http://127.0.0.1:7100"
position = "canopy"        # under the plants, sheltered, NOT yet calibrated

[sensor]
kind = "world"
sensor_id = "scd4x-0"
sample_interval_s = 10.0
# No temperature offset, because the real canopy sensor has none yet either.

[gpio]
# 21 HPS, 20 exhaust fans, 26 MH on its own module, 16 dark (CO2 moved to elantris), 12 spare.
lines = [21, 20, 26, 16, 12]
chip_label = "pinctrl-rp1"     # Pi 5

[gpio.failsafe]
# BCM 26 is active-HIGH, so its off is 0; getting it backwards lights the MH lamp on claim.
21 = 1
20 = 1
26 = 0
16 = 1
12 = 1
