# Sandbox greenhouse. Mirrors the far-end Pi 5 as verified 2026-09-10.
node_id = "greenhouse"
kind = "rpi"
agent_version = "0.1.0"
deadman_s = 30.0

[mqtt]
# Points at elantris's broker, which is what we plan to run first. A local
# broker bridged to elantris is a later step with its own risks.
url = "mqtt://127.0.0.1:1883"

[world]
url = "http://127.0.0.1:7100"
position = "canopy"        # under the plants, sheltered, NOT yet calibrated

[sensor]
kind = "world"
sensor_id = "scd4x-0"
sample_interval_s = 10.0
# The real canopy sensor has never had an offset set. Leaving this unset in the
# sandbox too, so the sandbox is wrong in the same way production is.

[gpio]
# 21 HPS via contactor, 20 exhaust fans, 26 MH via its own module,
# 16 dark (CO2 moved to elantris), 12 spare with no load.
lines = [21, 20, 26, 16, 12]
chip_label = "pinctrl-rp1"     # Pi 5

[gpio.failsafe]
# OFF is not one level. Four channels are active-LOW so 1 is off; BCM 26 is
# active-HIGH through its own module, so its OFF is 0. Getting this backwards
# lights the MH lamp the instant the agent claims the line.
21 = 1
20 = 1
26 = 0
16 = 1
12 = 1
