# Sandbox broker. Same shape as elantris's: an explicit listener, no anonymous
# access, per-identity ACLs. Running the sandbox open would hide exactly the
# class of bug that took a silent QoS-0 denial to find on the real broker.
listener 1883 127.0.0.1
allow_anonymous false
password_file PWFILE
acl_file ACLFILE
persistence false
log_type warning
log_type error
