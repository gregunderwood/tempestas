# Local development database only. Production on the Pi runs Postgres natively
# from apt - see the plan: a container bind-mount typo is exactly how the old
# system's 386MB of history ended up living only in a container layer.
services:
  db:
    image: postgres:17
    container_name: tempestas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tempestas
      POSTGRES_PASSWORD: tempestas
      POSTGRES_DB: tempestas
    volumes:
      # /var/lib/postgresql/data - NOT /var/lib/postgres, which Postgres ignores.
      - tempestas-db-data:/var/lib/postgresql/data
    ports:
      # 5433, because 5432 on this machine belongs to another project.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tempestas -d tempestas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tempestas-db-data:
